# Blueprint di esempio per Render (https://render.com/docs/blueprint-spec).
# Il frontend va su Vercel; questo servizio Docker ospita solo il backend opzionale.
services:
  - type: web
    name: palestra-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter            # i dischi persistenti richiedono un piano a pagamento
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: palestra-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_TOKEN
        sync: false          # segreto: impostalo dalla dashboard
      - key: ANTHROPIC_API_KEY
        sync: false          # segreto: opzionale, abilita l'assistente AI
      - key: ALLOWED_ORIGINS
        value: https://tuo-progetto.vercel.app
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: BACKUP_MAX_VERSIONS
        value: "10"
      - key: MAX_UPLOAD_MB
        value: "150"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75"
      # Per usare PostgreSQL invece di H2 su disco:
      # - key: SPRING_DATASOURCE_URL
      #   sync: false        # es. jdbc:postgresql://host:5432/palestra
      # - key: SPRING_DATASOURCE_USERNAME
      #   sync: false
      # - key: SPRING_DATASOURCE_PASSWORD
      #   sync: false
